name: hhk_cap01
description: Học Hứng Khởi — Flutter native, offline first
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  idb_shim: ^2.6.0
  sqflite: ^2.4.1
  path: ^1.9.0
  http: ^1.6.0
  mobile_scanner: ^7.5.0
  audioplayers: ^6.8.1
  archive: 4.7.1
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/content/grades/
    - assets/content/audio/
    - assets/brand/dopi-avatar.png
    - assets/brand/landing-hero.jpg

flutter_launcher_icons:
  web:
    generate: true
    image_path: "assets/brand/icon.png"
    background_color: "#FFFBF5"
    theme_color: "#FF7900"
