name: Commit canonical native Flutter platforms after green CI
on:
  workflow_run:
    workflows: ['Flutter / content / license CI']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: hhk-native-platforms
  cancel-in-progress: false
jobs:
  native:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter-native iOS, Android and Web projects
        working-directory: frontend-flutter
        run: |
          flutter create --project-name hhk_cap01 --platforms=android,ios,web .
          flutter pub get
          dart run flutter_launcher_icons
          dart format lib test
          flutter analyze
          flutter test
      - name: Commit canonical generated platforms and formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend-flutter/android frontend-flutter/ios frontend-flutter/web frontend-flutter/.metadata frontend-flutter/pubspec.lock frontend-flutter/lib frontend-flutter/test
          if git diff --cached --quiet; then
            echo 'Already committed'
            exit 0
          fi
          git commit -m 'chore: generate Flutter official Android iOS Web projects'
          git push origin HEAD:main
