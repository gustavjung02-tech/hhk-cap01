name: Prisma Compute staging release (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prisma-compute-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: prisma-compute-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Verify matching SHA passed full quality CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/staging'
          PASSES="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?branch=staging&head_sha=$GITHUB_SHA&event=push&status=success" --jq '.total_count')"
          test "$PASSES" -gt 0 || { echo 'No successful quality CI for this exact commit' >&2; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - name: Seed Ed25519 key into Prisma staging only if missing
        shell: bash
        run: |
          set -euo pipefail
          GENERATED_LEASE_KEY="$(openssl genpkey -algorithm ED25519 | base64 -w0)"
          echo "::add-mask::$GENERATED_LEASE_KEY"
          echo "LEASE_SIGNING_PRIVATE_KEY_PEM_BASE64=$GENERATED_LEASE_KEY" >> "$GITHUB_ENV"
      - name: Deploy Compute staging with GitHub OIDC
        id: prisma
        uses: prisma/cloud-deploy-action@v1
        with:
          working-directory: .
          module: backend-prisma/deploy/module.ts
          environment: staging
          install-command: bun install && test -s node_modules/prisma/dist/prisma.js && bun -e "await import('@prisma/composer'); await import('@prisma/composer-prisma-cloud')"
          build-command: npm --workspace backend-prisma run compute:build
      - name: Require an actual staging URL
        if: steps.prisma.outputs.outcome == 'succeeded'
        env:
          SERVICE_URL: ${{ steps.prisma.outputs.url }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_URL"
          curl --fail --silent --show-error --max-time 20 "$SERVICE_URL/api/v1/health" |
            jq -e '.ok == true and .status == "ready"'
          curl --fail --silent --show-error --max-time 20 "$SERVICE_URL/api/v1/public-key" |
            jq -e '.keyType == "ed25519-spki-der-base64url" and (.publicKey | length > 20)'
      - name: Reject skipped or unsuccessful deployments
        if: steps.prisma.outputs.outcome != 'succeeded'
        run: |
          echo "Prisma staging deploy did not succeed (inspect action summary)." >&2
          exit 1
